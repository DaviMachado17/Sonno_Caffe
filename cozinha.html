<!DOCTYPE html>
<!-- cozinha.html (linguagem: HTML) - ecrã da cozinha. Abre em /cozinha -->
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozinha - Sonno Caffe</title>
<link rel="stylesheet" href="style.css">
<style>
/* estilos só desta página (o resto vem do style.css) */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
.ped{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.ped h3{margin:0 0 4px;font-size:1.5rem;color:var(--acc)}
.ped small{color:var(--mut)}
.ped ul{margin:8px 0}
.ped button{width:100%;padding:12px;background:var(--acc);color:var(--on-acc);font-size:1rem}
</style>
</head>
<body>
<main>
  <h1>Cozinha</h1>
  <p class="sub" id="estado">A ligar...</p>
  <div class="cols">
    <section><h2>A preparar</h2><div id="novo"></div></section>
    <section><h2>Prontos</h2><div id="pronto"></div></section>
  </div>
</main>
<script src="cozinha.js"></script> <!-- o código está no cozinha.js -->
</body>
</html>
