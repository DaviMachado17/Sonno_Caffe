<!DOCTYPE html>
<!-- index.html (linguagem: HTML) - o ecrã do cliente.
     HTML só diz O QUE existe na página. O aspeto está no style.css
     e o comportamento (cliques, carrinho) está no script.js. -->
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sonno Caffe</title>
  <link rel="stylesheet" href="style.css"> <!-- liga o ficheiro de estilos -->
</head>
<body>
<main>
  <!-- Topo: logótipo (escondido até existir) e nome -->
  <header class="top">
    <img id="logo" alt="Logótipo Sonno Caffe" hidden>
    <div><h1>Sonno Caffe</h1><p class="sub">Peça aqui. Os produtos e preços são de exemplo.</p></div>
  </header>

  <!-- ECRÃ 1: escolher onde vai comer -->
  <section id="s1">
    <p>Onde vai comer?</p>
    <div class="big">
      <button data-mode="No local">Comer aqui</button>
      <button data-mode="Para levar">Para levar</button>
    </div>
  </section>

  <!-- ECRÃ 2: menu (esquerda) e carrinho (direita). Começa escondido. -->
  <section id="s2" hidden>
    <div class="tabs" id="tabs"></div>         <!-- separadores das categorias (o JS preenche) -->
    <div class="layout">
      <div class="grid" id="grid"></div>       <!-- produtos (o JS preenche) -->
      <aside>
        <h2>O seu pedido (<span id="mode"></span>)</h2>
        <ul id="cart"></ul>                    <!-- linhas do carrinho (o JS preenche) -->
        <p id="empty" class="sub">Ainda não escolheu nada.</p>
        <div class="total"><span>Total</span><span id="total">0,00 €</span></div>
        <button class="pay" id="pay" disabled>Pagar com cartão</button>
        <button class="ghost" id="reset">Recomeçar</button>
      </aside>
    </div>
  </section>

  <!-- ECRÃ 3: pedido feito, mostra o número. Começa escondido. -->
  <section id="s3" class="done" hidden>
    <p>Pagamento aceite. O número do seu pedido é</p>
    <div class="num" id="num"></div>
    <p id="where"></p>
    <button class="pay" style="max-width:280px" id="again">Novo pedido</button>
  </section>
</main>

<script src="script.js"></script> <!-- liga o JavaScript (tem de ficar no fim) -->
</body>
</html>
